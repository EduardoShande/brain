# A Supabase project on the free plan pauses after about a week without
# traffic, and a paused project takes sign-in and every paid course down
# with it. This asks the database for one row every day so that never
# happens again from quiet weeks alone.
#
# The key below is the publishable key, the same one the website ships to
# every visitor, so there is no secret here.

name: Keep the database awake

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Supabase for one row
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            "https://pxmlcaqltdytmvdpkryc.supabase.co/rest/v1/plans?select=id&limit=1" \
            -H "apikey: sb_publishable_mRp7bkrBMqQwPe2u4jOoyg_OV28XuuF")
          echo "HTTP $code"
          cat /tmp/body
          test "$code" = "200"
